<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pastel Chat UI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="chat-container">
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Contacts</h2>
    <ul>
  <li class="active" data-name="Alice"><span class="avatar">A</span> Alice</li>
  <li data-name="Bob"><span class="avatar">B</span> Bob</li>
  <li data-name="Charlie"><span class="avatar">C</span> Charlie</li>
</ul>

  </div>

  <!-- Chat area -->
  <div class="chat-area">
    <div class="chat-header">
      <h3>Alice</h3>
      <span>Online</span>
    </div>
    <div class="messages">
      <div class="message received">Hi there! 👋</div>
      <div class="message sent">Hello! How are you?</div>
    </div>
    <div class="input-box">
      <input type="text" placeholder="Type a message...">
      <button>Send</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
